version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: hris-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hris_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: hris-spring-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/hris_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
    container_name: hris-react-frontend
    ports:
      - "8081:8081"
    depends_on:
      - backend

volumes:
  db_data:
